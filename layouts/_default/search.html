{{ define "main" }}
<div class="frame search-page">
  <header class="page-head">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="page-sub">{{ . }}</p>{{ end }}
  </header>

  <form class="search-box" role="search" action="{{ .RelPermalink }}" method="get"
        data-index="{{ "index.json" | relURL }}">
    <svg class="search-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20.5 20.5l-4.2-4.2"></path></svg>
    <input type="search" id="q" name="q" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="Search posts, notes, projects…" aria-label="Search query">
  </form>

  <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
  <ul class="post-list" id="search-results"></ul>

  <noscript>
    <p class="search-status">Search needs JavaScript. Browse <a href="{{ "/blog/" | relURL }}">the blog</a> or <a href="{{ "/til/" | relURL }}">TIL notes</a> instead.</p>
  </noscript>
</div>

{{ $search := resources.Get "js/search.js" | resources.Minify | fingerprint }}
<script src="{{ $search.RelPermalink }}" integrity="{{ $search.Data.Integrity }}" defer></script>
{{ end }}
