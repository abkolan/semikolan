<footer class="site">
  <div class="foot">
    {{ with site.Params.colophon }}<p class="foot-colophon">{{ . | safeHTML }}</p>{{ end }}
    <p class="foot-meta"><span class="copyleft" role="img" aria-label="Copyleft">©</span> {{ now.Year }} <a href="https://semikolan.me">{{ site.Title }}</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA 4.0</a> · built with <a href="https://gohugo.io">Hugo</a> · {{ with os.Getenv "CF_PAGES_COMMIT_SHA" }}<a class="build" href="{{ site.Params.repo }}/commit/{{ . }}">{{ substr . 0 7 }}</a>{{ else }}<span class="build">dev</span>{{ end }}</p>
  </div>
</footer>
