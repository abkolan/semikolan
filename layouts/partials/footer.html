<footer class="site">
  <div class="foot">
    {{ with site.Params.colophon }}<p class="foot-colophon">{{ . | safeHTML }}</p>{{ end }}
    <p class="foot-meta">© {{ now.Year }} {{ site.Title }} · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA 4.0</a> · built with Hugo{{ with site.Home.GitInfo }} · <a class="build" href="{{ site.Params.repo }}/commit/{{ .Hash }}">{{ .AbbreviatedHash }}</a>{{ end }}</p>
  </div>
</footer>
