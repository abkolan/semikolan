<script>
  (function () {
    var root = document.documentElement;
    var sw = document.querySelector('.theme-switch');
    if (!sw) return;
    var opts = sw.querySelectorAll('.ts-opt');
    function current() {
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') return t; } catch (e) {}
      return 'system';
    }
    function apply(mode) {
      if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode);
      else root.removeAttribute('data-theme');
      try { if (mode === 'system') localStorage.removeItem('theme'); else localStorage.setItem('theme', mode); } catch (e) {}
      opts.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false'); });
    }
    apply(current());
    opts.forEach(function (b) { b.addEventListener('click', function () { apply(b.dataset.mode); }); });
  })();
</script>

<script>
  (function () {
    document.querySelectorAll('pre.chroma').forEach(function (pre) {
      var code = pre.querySelector('code');
      if (!code) return;
      var mount = pre.closest('figure.code') || pre.parentElement;
      if (mount.querySelector(':scope > .copy-btn')) return;
      mount.classList.add('has-copy');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.setAttribute('aria-label', 'Copy code to clipboard');
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(copyText(mount, code)).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('copied');
          setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1400);
        });
      });
      mount.appendChild(btn);
    });
    function copyText(mount, code) {
      // console blocks: copy only the commands (lines with a $ prompt), minus the prompt
      if (mount.querySelector('.gp')) {
        return code.textContent.split('\n')
          .filter(function (l) { return /^\s*\$/.test(l); })
          .map(function (l) { return l.replace(/^\s*\$\s?/, ''); })
          .join('\n').replace(/\s+$/, '');
      }
      return code.textContent.replace(/\s+$/, '');
    }
  })();
</script>

<script>
  (function () {
    var tip = 'Back to where you were reading';
    document.querySelectorAll('a.footnote-backref').forEach(function (a) {
      a.setAttribute('data-tip', tip);
      a.setAttribute('aria-label', tip);
    });
  })();
</script>

<script>
  (function () {
    var bar = document.querySelector('.bar');
    var btn = document.getElementById('navToggle');
    if (!bar || !btn) return;
    function setOpen(open) {
      bar.classList.toggle('nav-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      setOpen(btn.getAttribute('aria-expanded') !== 'true');
    });
    bar.querySelectorAll('nav.main > a').forEach(function (a) {
      a.addEventListener('click', function () { setOpen(false); });
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    document.addEventListener('click', function (e) {
      if (bar.classList.contains('nav-open') && !bar.contains(e.target)) setOpen(false);
    });
  })();
</script>

  var d = document.documentElement;

  var serif = '"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif';

    primaryTextColor: '#1a1613', secondaryColor: '#efece3', tertiaryColor: '#faf9f5',
    lineColor: '#6e6a61', edgeLabelBackground: '#faf9f5', tertiaryTextColor: '#1a1613'
