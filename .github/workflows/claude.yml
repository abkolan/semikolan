name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Proofreading checklist credit: Simon Willison
          # https://simonwillison.net/guides/agentic-engineering-patterns/prompts/changes/
          claude_args: |
            --append-system-prompt "When this PR changes markdown blog posts under content/**/*.md, also proofread the prose using this checklist (credit: Simon Willison, https://simonwillison.net/guides/agentic-engineering-patterns/prompts/changes/): 1) Identify spelling mistakes and typos. 2) Identify grammar mistakes. 3) Watch out for repeated terms like 'It was interesting that X, and it was interesting that Y'. 4) Spot any logical errors or factual mistakes. 5) Highlight weak arguments that could be strengthened. 6) Make sure there are no empty or placeholder links."
