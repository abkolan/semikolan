baseURL = "https://semikolan.dev/"
title = "semikolan"
defaultContentLanguage = "en"
enableGitInfo = true
enableRobotsTXT = true
capitalizeListTitles = false

[params]
  author = "Abhilash Kolanthara"
  description = "Notes on tech, AI, systems, and whatever's nagging at me."
  repo = "https://github.com/abkolan/semikolan"

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 1
  [[menu.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 2
  [[menu.main]]
    name = "TIL"
    pageRef = "/til"
    weight = 3
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 4

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['$', '$'], ['\(', '\)']]
    [markup.goldmark.extensions.extras]
      [markup.goldmark.extensions.extras.delete]
        enable = true
      [markup.goldmark.extensions.extras.insert]
        enable = true
      [markup.goldmark.extensions.extras.mark]
        enable = true
      [markup.goldmark.extensions.extras.subscript]
        enable = true
      [markup.goldmark.extensions.extras.superscript]
        enable = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 4
    wrapperClass = "chroma"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# Allow reading Cloudflare Pages build env vars (e.g. CF_PAGES_COMMIT_SHA) in templates.
[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^CF_PAGES_']
