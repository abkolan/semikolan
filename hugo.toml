baseURL = "https://semikolan.me/"
title = "semikolan.me"
defaultContentLanguage = "en"
enableGitInfo = true
enableRobotsTXT = true

[params]
  author = "Abhilash Kolanthara"
  description = "Notes on tech, AI, systems, and whatever's nagging at me."
  intro = "I'm <strong>Abhilash Kolanthara</strong> — an engineer who writes to think. Notes on tech, AI, systems, and whatever's nagging at me."
  colophon = "Writing is thinking — and you grow by embarrassing yourself. So here's me doing exactly that, about tech, AI, and whatever's nagging at me."
  repo = "https://github.com/abkolan/semikolan.me"

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 1
  [[menu.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 2
  [[menu.main]]
    name = "TIL"
    pageRef = "/til"
    weight = 3
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 4

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\[', '\]']]
        inline = [['$', '$'], ['\(', '\)']]
    [markup.goldmark.extensions.extras]
      [markup.goldmark.extensions.extras.delete]
        enable = true
      [markup.goldmark.extensions.extras.insert]
        enable = true
      [markup.goldmark.extensions.extras.mark]
        enable = true
      [markup.goldmark.extensions.extras.subscript]
        enable = true
      [markup.goldmark.extensions.extras.superscript]
        enable = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 4
    wrapperClass = "chroma"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
